version: 2
updates:
  # Root package dependencies.
  # NOTE: Dependabot's npm updater recurses from "/" into every nested
  # package.json, and neither the singular `directory` nor plural `directories`
  # with `!` exclusion globs stops that recursion. So the ONLY reliable way to
  # keep this entry from bumping the components/renderer (which carry their own
  # narrow allow/ignore lists, e.g. react-docgen is pinned) is the `allow` list
  # below: it names only packages that exist SOLELY in the root package.json, so
  # even while recursing, Dependabot opens root-only PRs. npm-run-all, rimraf and
  # @types/jest are intentionally omitted — they also live in the components and
  # would produce duplicate PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
    allow:
      - dependency-name: "@lerna/*"
      - dependency-name: "@percy/cli"
      - dependency-name: "husky"
      - dependency-name: "lerna"
      - dependency-name: "lint-staged"

  # Dash renderer
  - package-ecosystem: "npm"
    directory: "/dash/dash-renderer"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
    allow:
      - dependency-name: "@types/*"
      - dependency-name: "@babel/*"
      - dependency-name: "babel-loader"
      - dependency-name: "ts-loader"
      - dependency-name: "cookie"
      - dependency-name: "webpack*"
      - dependency-name: "typescript"

  # Components - dash-core-components
  - package-ecosystem: "npm"
    directory: "/components/dash-core-components"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Only auto-update these packages for version updates
    allow:
      - dependency-name: "date-fns"
      - dependency-name: "file-saver"
      - dependency-name: "ramda"
      - dependency-name: "react-window"
      - dependency-name: "@radix-ui/*"
      - dependency-name: "@types/*"
      - dependency-name: "@babel/*"
      - dependency-name: "babel-loader"
      - dependency-name: "webpack*"
      - dependency-name: "typescript"
    # react-docgen is pinned for legacy metadata extraction (extract-meta.js uses
    # the react-docgen 5 API) and must never be updated.
    ignore:
      - dependency-name: "react-docgen"

  # Components - dash-html-components
  - package-ecosystem: "npm"
    directory: "/components/dash-html-components"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
    allow:
      - dependency-name: "@types/*"
      - dependency-name: "@babel/*"
      - dependency-name: "babel-loader"
      - dependency-name: "webpack*"
      - dependency-name: "typescript"
    # react-docgen is pinned for legacy metadata extraction (extract-meta.js uses
    # the react-docgen 5 API) and must never be updated.
    ignore:
      - dependency-name: "react-docgen"

  # Components - dash-table
  - package-ecosystem: "npm"
    directory: "/components/dash-table"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
    allow:
      - dependency-name: "@types/*"
      - dependency-name: "@babel/*"
      - dependency-name: "babel-loader"
      - dependency-name: "ts-loader"
      - dependency-name: "css-loader"
      - dependency-name: "less"
      - dependency-name: "less-loader"
      - dependency-name: "webpack*"
      - dependency-name: "typescript"
    # react-docgen is pinned for legacy metadata extraction (extract-meta.js uses
    # the react-docgen 5 API) and must never be updated.
    ignore:
      - dependency-name: "react-docgen"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    # Keep lower bounds (e.g. Flask>=1.0.4 in install.txt) low: only raise a
    # floor when the latest release is incompatible with the current range.
    # Exact (==) pins in ci/dev/testing still update as normal.
    versioning-strategy: increase-if-necessary
    groups:
      pip-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      pip-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
    # jupyterlab is pinned <4.0.0: jupyterlab 4.x ships jlpm as Yarn Berry, which
    # cannot consume @plotly/dash-jupyterlab's Yarn 1 lockfile and breaks the build.
    ignore:
      - dependency-name: "jupyterlab"
        versions: [">=4.0.0"]
